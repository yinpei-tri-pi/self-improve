# every perturbed episode pairs with the check run's unperturbed one. Perturbation always on: up to 10 cm
# forward/sideways and 15 degrees off the recorded start (0.3 m / 30 deg, the first check, drifted far from the counter).
#   scripts/cluster_rollout.sh aug_check_shift10 0 <270k ckpt> --config configs/aug_check.yaml
#   .venv/bin/python scripts/build_debug_site.py aug_check_shift10 --compare sub50_check_20261125
