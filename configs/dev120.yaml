# The full development run (the user, 2026-11-25): all 120 development tasks of assets/rollout_tasks.json (18 atomic_seen,
# 16 composite_seen, 44 pretrain atomic, 42 pretrain composite; no composite_unseen task), 30 recorded episodes each
# per round (3,600 episodes, ~$2,950 of API, ~8 h on 16 nodes), the subset run's settings otherwise.
#   .venv/bin/python -m selfimprove.cli run --config configs/dev120.yaml
exp_id: si_dev120
iterations: 3  # raise for more rounds (the start draw never runs out)
rollout:
  tasks: rollout
  pilot_seeds_per_task: 30
  seeds_per_task: 30
  num_gpus: 16
  # starts (the user, 2026-11-25): each task's recordings in one fixed shuffled order, 30 per round, wrapping around
  # when they run out, so every round has 30 per task however many rounds. The first pass plays the recorded starts;
  # a recording played again (its second pass on) is placed up to 10 cm forward/sideways and 15 degrees off its start,
  # salted by the round, so no two starts repeat (HexaShell start_shift / start_turn / start_salt per episode; draws
  # closer than 4 cm to the kitchen are redrawn). With ~100 recordings a task: rounds 0-2 recorded, from 3 perturbed
  start_draw: sequential
  augment_from_round: null
  start_shift: 0.1
  start_turn: 15
eval:
  enabled: false
# S1 training of each round (the user, 2026-11-25): 2 p5 nodes -> batch 256; 80% rollout data / 20% base data;
# 15k steps (~205 new samples a step: one pass over round 0's 900k samples is ~4.4k steps, so ~3.4 passes;
# ~0.77M base samples = 2.2% of the base set); checkpoints every 5k (5k / 10k / 15k for the eval)
# preprocessing: 4 workers (16 on 1,500 episodes used too much memory, 2026-11-25)
filter:
  workers: 4
train:
  image_tag: "20261125-175016"   # the verified openpi-si image (the two-stream mixer); no rebuild per round
  batch_size: 256
  new_data_fraction: 0.8
  # (the user, 2026-11-26) ~2 passes over a round's ~2.6M new samples (256 x 80% per step), 2k warmup (a fresh
  # optimizer on the EMA weights), then flat 5e-5; only the final checkpoint
  steps: 25000
  save_interval: 25000
  warmup_steps: 2000
cluster:
  rollout_address: http://10.242.5.98:8265   # the running head: the scheduler never runs ray up itself
dashboard:
  jobs:
    0:
      s2_train: {name: yinpei-sys2-si-mix-qwen3vl-4b-gb192-full-zero2-2-11-26-09-31-47, queues: [fss-vla-p5-48xlarge-us-west-2], steps: 300,
                 note: "the S2 SMOKE test (300 steps, the check run's 4,008 rows + the old set 50/50), not round 0's S2 training: that one is submitted once the smoke passes"}
  # the starting checkpoints' own training runs (2026-11-26, from their SageMaker CloudWatch logs and the S2 logging.jsonl)
  reference:
    - {name: "S1 start: the 270k openpi checkpoint (f0717-270k-bs512-progact)", final: "loss 0.0059 (flow_loss_real 0.0162) at step 268,800",
       start: "0.281 at step 0", run: "4 x p5, batch 512, 270k steps, 2.28 s/step, 7 days (2026-07-27 -> 08-04)",
       where: "SageMaker AWSBatchyinpei-pi05-robocasa-mnd2686495f7c73354b4de4e11c41a36aa (CloudWatch /aws/sagemaker/TrainingJobs)"}
    - {name: "S2 reference: the 0804 Qwen3-VL-4B full fine-tune (system2-full-0804-qwen3vl-4b-gb192-full-vitfull-...-ep3)",
       final: "loss ~0.115, token accuracy ~0.956 (0.150 averaged over the run)", start: "1.39 at step 1",
       run: "2 x p5, batch 192 (3 x 16 GPUs x grad-acc 4), 17,124 steps = 3 epochs of full0804 (1.1M samples), 30 h",
       where: "s3://tri-ml-datasets-uw2/yinpeidai/system2_ckpt/qwen_ft_ckpts/system2-full-0804-qwen3vl-4b-gb192-full-vitfull-lr1e5-vitlr2e6-alignerlr1e5-zero2-2n-ep3/logging.jsonl"}
