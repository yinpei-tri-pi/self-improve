# The self-improvement loop's configuration (see selfimprove/config.py for the S3 layout).
# An experiment file (configs/<exp>.yaml) overrides any of these; `--set key.sub=value` overrides both.

exp_id: si_v1
s3_root: s3://tri-ml-datasets-uw2/yinpeidai/self_improve
aws_region: us-west-2                 # the bucket's region (the Ray clusters run in us-east-1)
aws_profile: sagemaker                # local profile for S3 + SageMaker (the clusters use instance roles)
work_dir: /mnt/ssd1/self_improve_runs  # everything an experiment downloads or makes here (the user, 2026-11-25): rollout copies, shards, state, logs
iterations: 6                         # rollout -> filter -> train rounds (S2 is trained once, at the end)

start:
  # S1 = our subgoal-conditioned pi0.5 (progress-as-action, noexec): the checkpoint of the 53.7% run
  s1_ckpt: s3://tri-ml-datasets-uw2/yinpeidai/openpi/checkpoints/f0717-270k-bs512-progact/pi05_robocasa_system1/f0717-270k-bs512-progact__progact_granfine_verbsimp_noexec/269999
  # S2 = our Qwen3-VL-4B planner (fixed during the S1 rounds; used by the target-split evaluation)
  s2_ckpt: s3://tri-ml-datasets-uw2/yinpeidai/system2_ckpt/qwen_ft_ckpts/system2-full-0804-qwen3vl-4b-gb192-full-vitfull-lr1e5-vitlr2e6-alignerlr1e5-zero2-2n-ep3/checkpoint-17124

wandb:
  project: s1s2-self-improve
  entity: null                        # null: the API key's default entity
  base_url: https://api.forge.coreweave.com

# ---------------------------------------------------------------------------------------------------
rollout:
  # the planner's API prices, $ per 1M tokens (OpenAI's Standard tier for gpt-6.2-astra, short context: requests up
  # to 272K input tokens; checked 2026-11-25 at developers.openai.com/api/docs/pricing): the rounds' cost in _status /
  # _DONE (api_cost_usd) and on the dashboard
  api_price: {model: gpt-6.2-astra, input: 8.00, cached_input: 0.40, output: 40.00}
  # rollout (the default): the 120 development tasks of assets/rollout_tasks.json (scripts/rollout_tasks.py,
  # docs/rollout_tasks.md): the 34 atomic_seen + composite_seen target tasks, all 44 pretrain atomic tasks and 42 of
  # the 64 pretrain composite tasks of the composite_unseen families (the 22 weakest in the prompt A/B dropped). The
  # composite_unseen tasks are held out of every training rollout and all training data (tasks.held_out_tasks()).
  # pretrain300: RoboCasa's pretraining tasks with demo replay success >= min_replay_success; selected: rule A's 108
  tasks: rollout
  min_replay_success: 0.8
  include_tasks: []                   # restrict to these (empty: all that pass the filter)
  exclude_tasks: []
  # split demo: every round plays seeds_per_task of each task's own recorded pretrain episodes (RoboCasa's
  # datasets: assets/demo_episodes.json; 100-503 per task), drawn at random, never one an earlier round played
  seeds_per_task: 30
  pilot_seeds_per_task: 30            # iteration 0: the same as the others (null: seeds_per_task)
  # seeds are drawn per (experiment, iteration, task) from this range, never reused within the
  # experiment; the split is RoboCasa's pretrain kitchens (layouts/styles 11-60, pretrain objects),
  # disjoint from the target split (kitchens 1-10, target objects) that the evaluation uses
  seed_range: [100000, 999999]        # splits pretrain / pretrain50 only
  # demo: the episode starts exactly as a recorded episode of RoboCasa's pretrain-split datasets (its first sim
  # state, kitchen and objects: HexaShell's split demo, from the sim states on the node); pretrain: the seed draws
  # a pretrain kitchen
  split: demo
  # HexaShell settings for every episode (--set NAME=VALUE): Astra plans, System1 executes what it
  # can, the harness takes over when System1 fails (DAgger-style corrections), every step recorded
  hexashell_sets:
    api: responses
    api_base: https://api.openai.com/v1
    model: gpt-6.2-astra
    reasoning_effort: high
    s1: first
    skills: "yes"
    trajectory: "yes"
    trajectory_size: 256
  # per GPU: one S1 server (JAX, ~17-20 GB) + one SAM3 service (~3 GB) + `slots_per_gpu` simulators
  # (~2 GB each, ~3 CPU cores each); 48 GB L40S (g6e) -> 4 slots, 24 GB A10G (g5) -> 1 slot
  slots_per_gpu: 4
  s1_mem_gb: 20
  recycle_after: 20                   # restart a slot's warm simulator after this many episodes
  max_attempts: 2                     # an episode that errored is played again on a fresh simulator
  episode_timeout_s: 9000
  # per-chunk surrogate loss of the rollout checkpoint (= the round's reference) on every executed
  # chunk, S1's and the harness's alike: rollout/<task>/<seed>/chunk_scores.jsonl
  score:
    enabled: true
    num_draws: 4
    stride: 16                        # one scored chunk every `stride` control steps (S1's replan period)
  num_gpus: 16                        # GPU workers the driver asks for: 16 x g6e.4xlarge (1 GPU each) = 256 vCPU
  cluster_config: cluster/rollout.yaml

# ---------------------------------------------------------------------------------------------------
# Astra as the process reward model: every segment (one subgoal executed by S1 or by the harness) gets
# very_good | good | neutral | bad | very_bad from the next turn's judgement, what followed it, the
# episode's outcome and how long it took.  S1 segments: very_good/good -> positives (AWR-weighted SL +
# unary-positive), bad/very_bad -> negatives (unary-negative only).  Harness segments that completed
# their subgoal -> positives (the DAgger corrections, in states S1 itself reached).
filter:
  # local storage (the user, 2026-11-26): raw rollout copies of at most 3 rounds; after a confirmed upload only a few
  # shards stay for checking (everything is on S3)
  keep_rollout_rounds: 3
  keep_local_s1_shards: 8
  keep_local_s2_shards: 4
  advantage: {very_good: 2.0, good: 1.0, neutral: 0.0, bad: -1.0, very_bad: -2.0}
  awr_beta: 1.0
  awr_max_weight: 5.0
  slow_factor: 1.5                    # S1 took > slow_factor x est_length -> at most 'good'
  use_s1_positive: [very_good, good]
  use_s1_negative: [bad, very_bad]
  use_harness_positive: [very_good, good]
  drop_error_episodes: true           # gateway / simulator errors
  min_segment_steps: 8
  halt_frames: 1                      # one settled stop frame after each positive span (as the base data)
  negative_quality: Success           # negatives are scored under the conditioning used at inference
  slow_quality: Suboptimal            # 'good' because slow -> Quality: Suboptimal (as the base data)
  samples_per_shard: 2048
  planner: v2                         # v2: the agreed span rules (selfimprove/data/s1_select.py); prm: the old PRM scoring
  slim: true                          # write only the fields openpi's production loader reads (+ provenance)
  workers: 16

# ---------------------------------------------------------------------------------------------------
train:
  backend: sagemaker                  # sagemaker | local
  dry_run: false                      # true: plan the job (launch.py --dry-run), never submit
  openpi_dir: ~/openpi-si             # the openpi checkout with the self-improvement objective
  openpi_python: ~/openpi/.venv/bin/python   # has the sagemaker SDK (openpi's sagemaker group)
  sagemaker_config: scripts/sagemaker/config_robocasa_multinode.yaml
  instance_type: p5
  instance_count: 2
  queue: vla
  # S1 training always on the reserved p5 queue at priority 150 (the user, 2026-11-26); S2 too: no spot queues for this experiment
  queue_full_name: fss-vla-p5-48xlarge-us-west-2
  queue_priority: 150
  max_run_days: 2                     # SageMaker's run-time limit per S1 job (25k steps ~8-10 h; 2 days to be safe)
  image_tag: null                     # null: build + push from openpi_dir's HEAD at the first round
  config: pi05_robocasa_system1
  # the 270k run's flags (progress-as-action, no executed-step) so the checkpoint loads unchanged
  model_flags: "--data.progress-as-action --model.no-use-progress-head --data.no-include-executed-step"
  steps: 10000
  batch_size: 512
  fsdp_devices: 8
  lr: 5.0e-5                          # flat, as the 270k run (EMA-only checkpoints continue cleanly)
  warmup_steps: 200
  ema_decay: 0.999
  save_interval: 5000
  # the base data the rounds keep replaying (no forgetting) and the share of the batches the new
  # rollout shards should take (the shard list is repeated to reach it)
  base_shards: s3://tri-ml-datasets-uw2/yinpeidai/robocasa_final_training_shard/system1_fullset_0717/
  new_data_fraction: 0.7             # 70% rollout data, 30% base data (the base shards in a new random order each round)
  max_repeat: 200                     # cap on the rollout shards' repeat factor
  objective: sl                       # sl: the normal training objective (positives only); si: the old self-improvement objective
  si:
    lambda_sl: 1.0
    lambda_pos: 0.1
    lambda_neg: 0.1
    beta_pos: 10.0
    beta_neg: 10.0
  poll_s: 600
  max_retries: 1

# ---------------------------------------------------------------------------------------------------
# S1 (each round's new checkpoint) + S2 (start.s2_ckpt) on RoboCasa's target split: the protocol of the
# 53.7% run (openpi examples/robocasa/combined_eval.py; the 30 recorded target episodes of each of the
# 50 tasks reset to their first frame; all rule tiers, last-milestone retry, official horizons)
eval:
  enabled: true
  episodes: target30                  # 50 tasks x 30 = 1500 episodes
  openpi_dir: ~/openpi-si
  combined_eval_flags: ""             # extra combined_eval.py flags (the -inst-retry arm by default)
  s1_mem_gb: 20
  s2_gpu_frac: 0.42
  s2_gpu_run_args: null                # docker GPU flags for the S2 vLLM (null: --gpus device=N; snap/CDI docker:
                                      # "--runtime=nvidia -e NVIDIA_VISIBLE_DEVICES={gpu}")
  stacks_per_gpu: 1
  num_gpus: 16
  cluster_config: cluster/eval.yaml
  target_data_uri: s3://tri-ml-datasets-uw2/yinpeidai/robocasa_dataset/v1.0/target
  episode_timeout_s: 7200
  baseline: {overall: 0.537, atomic_seen: 0.794, composite_seen: 0.544, composite_unseen: 0.240}

# ---------------------------------------------------------------------------------------------------
s2:
  enabled: false                      # the language annotation (cheap LLM) is a later stage
  annotate_model: null

# ---------------------------------------------------------------------------------------------------
# Where the Ray drivers run.  ray: as Ray jobs on the clusters' heads (cluster/*.yaml; `ray up` when they
# are not up); local: on this machine (its GPUs; the sanity checks).
cluster:
  mode: ray
  rollout_config: cluster/rollout.yaml
  eval_config: cluster/eval.yaml
  rollout_address: null               # e.g. http://10.0.1.2:8265 (null: ray get-head-ip <config>)
  eval_address: null
  head_python: /home/ubuntu/selfimprove/.venv/bin/python
  job_env:                            # the nodes' paths (cluster/setup_node.sh puts everything there)
    SI_HEXASHELL_ROOT: /home/ubuntu/HexaShell-s1
    SI_OPENPI_DIR: /home/ubuntu/openpi-si
    SI_OPENPI_PYTHON: /home/ubuntu/openpi-si/.venv/bin/python
    SI_SYS2_DIR: /home/ubuntu/sys2_train_eval
    SI_EVAL_ROBOCASA_PYTHON: /home/ubuntu/micromamba/envs/robocasa/bin/python
    HEXASHELL_ENV: /home/ubuntu/HexaShell-s1/config/env.cluster.sh
    SI_NODE_DIR: /mnt/data/selfimprove
  local_env: {}
  poll_s: 300
