[project]
name = "selfimprove"
version = "0.1.0"
description = "Self-improvement loop for System1 (openpi pi0.5) and System2 (Qwen3-VL): Astra-in-the-loop rollouts on Ray, PRM filtering, S1 continue-training, target-split evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ray[default]==2.57.0",
    "wandb>=0.19",
    "boto3>=1.34",
    "numpy>=1.26,<2.3",
    "pillow>=10",
    "pyyaml>=6",
    "msgpack>=1.0",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
selfimprove = "selfimprove.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["selfimprove*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
